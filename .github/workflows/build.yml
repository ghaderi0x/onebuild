name: Build OneBuild binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            name: onebuild-macos-intel
          - goos: darwin
            goarch: arm64
            name: onebuild-macos-arm64
          - goos: linux
            goarch: amd64
            name: onebuild-linux-amd64
          - goos: linux
            goarch: arm64
            name: onebuild-linux-arm64
          - goos: windows
            goarch: amd64
            name: onebuild-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet
        run: go vet ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o ${{ matrix.name }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}